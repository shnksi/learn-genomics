  <text x="196.0" y="198.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="700" fill="#1e40af" text-anchor="middle">1 sorted cell per well → full-length cDNA</text>
  <rect x="40.0" y="214.0" width="312.0" height="108.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="196.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#1e40af" text-anchor="middle">Strengths &amp; trade-offs</text>
  <text x="196.0" y="250.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Coverage: FULL gene body (5′→3′, sees splicing!).</text>
  <text x="196.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Sensitivity: high (~5,000–10,000 genes/cell).</text>
  <text x="196.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Scale: 10²–10³ cells (high cost per cell).</text>
  <text x="196.0" y="292.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Ideal for: rare FACS-sorted populations &amp; isoforms.</text>
