  <rect x="408.0" y="214.0" width="312.0" height="108.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="564.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#085f55" text-anchor="middle">Strengths &amp; trade-offs</text>
  <text x="564.0" y="250.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Coverage: 3′ (or 5′) tag ONLY + UMI barcode.</text>
  <text x="564.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Scale: 10⁴–10⁶ cells cheaply (tissue atlases!).</text>
  <text x="564.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Sparse counts: ~1,000–3,000 genes/cell (dropouts).</text>
  <text x="564.0" y="292.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">• Poisson loading creates ambient RNA &amp; doublets.</text>
