<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="385.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Mitosis versus Meiosis I &amp; II: tracking ploidy (n) and DNA content (C)</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Meiosis I is the reductional division (separates homologs after crossing-over); Mitosis and Meiosis II separate sister chromatids</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="260.0" height="294.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1e40af" text-anchor="start">Mitosis — 1 division (2 identical 2n cells)</text>
  <circle cx="154.0" cy="134.0" r="30.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="154.0" y="132.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">2n, 4C</text>
  <text x="154.0" y="147.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#64748b" text-anchor="middle">(replicated)</text>
  <line x1="154.0" y1="168.0" x2="154.0" y2="212.0" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <text x="164.0" y="194.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#1e40af" text-anchor="start">Sister chromatids</text>
  <text x="164.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#1e40af" text-anchor="start">separate</text>
  <circle cx="98.0" cy="250.0" r="28.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="98.0" y="253.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">2n, 2C</text>
  <circle cx="210.0" cy="250.0" r="28.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210.0" y="253.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">2n, 2C</text>
  <text x="154.0" y="306.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Diploid → Diploid</text>
  <text x="154.0" y="322.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">No pairing of homologs</text>
  <text x="154.0" y="338.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Clonal genetic identity</text>
  <rect x="304.0" y="72.0" width="432.0" height="294.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="316.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Meiosis — 2 divisions (4 unique haploid n gametes)</text>
  <circle cx="520.0" cy="126.0" r="28.0" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="520.0" y="125.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">2n, 4C</text>
  <text x="520.0" y="138.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#c25e0a" text-anchor="middle">Prophase I</text>
  <rect x="564.0" y="114.0" width="154.0" height="24.0" rx="12.0" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.2"/>
  <text x="641.0" y="129.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c25e0a" text-anchor="middle">Crossing-over (chiasmata)</text>
  <line x1="500.0" y1="154.0" x2="424.0" y2="194.0" stroke="#0d8a7b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <line x1="540.0" y1="154.0" x2="616.0" y2="194.0" stroke="#0d8a7b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <text x="520.0" y="178.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">Meiosis I (homologs separate)</text>
  <circle cx="414.0" cy="220.0" r="24.0" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="414.0" y="224.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">n, 2C</text>
  <circle cx="626.0" cy="220.0" r="24.0" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="626.0" y="224.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">n, 2C</text>
  <text x="520.0" y="256.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Meiosis II (sister chromatids separate)</text>
  <line x1="414.0" y1="245.0" x2="362.0" y2="282.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-purple)"/>
  <circle cx="362.0" cy="308.0" r="22.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="362.0" y="312.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">n, 1C</text>
  <line x1="414.0" y1="245.0" x2="466.0" y2="282.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-purple)"/>
  <circle cx="466.0" cy="308.0" r="22.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="466.0" y="312.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">n, 1C</text>
  <line x1="626.0" y1="245.0" x2="574.0" y2="282.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-purple)"/>
  <circle cx="574.0" cy="308.0" r="22.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="574.0" y="312.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">n, 1C</text>
  <line x1="626.0" y1="245.0" x2="678.0" y2="282.0" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-purple)"/>
  <circle cx="678.0" cy="308.0" r="22.0" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="678.0" y="312.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">n, 1C</text>
  <text x="520.0" y="352.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#334155" text-anchor="middle">Independent assortment (2²³) + crossing-over generate genetic diversity</text>
</svg>
