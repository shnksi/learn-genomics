  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Step 1: 2′-OH attacks 5′ splice site</text>
  <rect x="40.0" y="146.0" width="54.0" height="24.0" rx="4" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.6"/>
  <text x="67.0" y="162.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">Exon 1</text>
