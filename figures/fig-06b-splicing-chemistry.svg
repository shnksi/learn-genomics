  <text x="624.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#085f55" text-anchor="middle">Seamless coding junction</text>
  <circle cx="608.0" cy="210.0" r="18.0" fill="#fff3e5" stroke="#c25e0a" stroke-width="2"/>
  <line x1="626.0" y1="210.0" x2="666.0" y2="210.0" stroke="#c25e0a" stroke-width="2.2" stroke-linecap="round"/>
  <text x="624.0" y="244.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#c25e0a" text-anchor="middle">Excised intron lariat (degraded)</text>
  <text x="624.0" y="276.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">ATP is spent ONLY by RNA</text>
