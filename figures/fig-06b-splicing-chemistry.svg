  <text x="524.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Products: Mature mRNA + Lariat</text>
  <rect x="544.0" y="132.0" width="72.0" height="26.0" rx="4" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.8"/>
