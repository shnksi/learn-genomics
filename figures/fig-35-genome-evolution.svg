  <text x="54.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#0f172a" text-anchor="start">Copy 1 keeps E1 (brain); Copy 2 keeps E2 (heart) → both essential!</text>
