  <line x1="48.0" y1="224.0" x2="344.0" y2="224.0" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 48 242 L 138 242 L 164 282 L 238 282 L 264 242 L 344 242" fill="none" stroke="#2563eb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
