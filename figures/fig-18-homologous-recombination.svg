  <text x="252.0" y="266.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9f1239" text-anchor="middle">HJ2</text>
  <text x="196.0" y="326.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">Heteroduplex patch → gene conversion if mismatched</text>
  <rect x="392.0" y="174.0" width="344.0" height="168.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
