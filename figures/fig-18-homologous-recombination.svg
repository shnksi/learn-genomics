  <rect x="0.0" y="0.0" width="760.0" height="365.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Homologous recombination: DSB repair and meiotic crossing-over</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">One molecular machine repairs broken forks (mostly non-crossovers) and generates meiotic chiasmata (crossovers)</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="76.0" width="166.0" height="76.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="107.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d8a7b" text-anchor="middle">1. DSB &amp; Resection</text>
  <text x="107.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">Spo11 / damage breaks duplex;</text>
  <text x="107.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">5′→3′ resection leaves 3′ tails</text>
  <line x1="192.0" y1="114.0" x2="226.0" y2="114.0" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-ink)"/>
