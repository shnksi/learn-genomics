  <rect x="412.0" y="210.0" width="304.0" height="52.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="564.0" y="230.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">Crossover (flanking markers swapped)</text>
  <text x="564.0" y="246.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">Required in meiosis I (≥1 per chromosome) to hold homologs</text>
  <rect x="412.0" y="276.0" width="304.0" height="52.0" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
  <text x="564.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#15803d" text-anchor="middle">Non-crossover / SDSA (flanks intact)</text>
  <text x="564.0" y="312.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">Preferred in somatic cells to avoid loss of heterozygosity</text>
</svg>
