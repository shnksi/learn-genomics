  <text x="289.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">2. Strand Invasion</text>
  <text x="289.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">RAD51/DMC1 filament invades</text>
  <text x="289.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="middle">homolog, displacing a D-loop</text>
  <line x1="374.0" y1="114.0" x2="408.0" y2="114.0" stroke="#334155" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-ink)"/>
