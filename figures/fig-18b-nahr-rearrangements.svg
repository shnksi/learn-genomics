<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Non-Allelic Homologous Recombination (NAHR): homology in the wrong place</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Repeat orientation dictates the structural outcome: direct flanking repeats generate deletions/duplications; inverted repeats flip the segment</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="348.0" height="264.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Direct segmental duplications (→ ... →) → Del + Dup</text>
  <line x1="44.0" y1="128.0" x2="340.0" y2="128.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="74.0" y="118.0" width="42.0" height="20.0" rx="3" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="95.0" y="132.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">SD →</text>
  <rect x="128.0" y="118.0" width="66.0" height="20.0" rx="3" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="161.0" y="132.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#085f55" text-anchor="middle">Gene X</text>
  <rect x="206.0" y="118.0" width="42.0" height="20.0" rx="3" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="227.0" y="132.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">SD →</text>
  <line x1="74.0" y1="174.0" x2="352.0" y2="174.0" stroke="#0f172a" stroke-width="2.6" stroke-linecap="round"/>
  <rect x="206.0" y="164.0" width="42.0" height="20.0" rx="3" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="227.0" y="178.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">SD →</text>
  <rect x="260.0" y="164.0" width="66.0" height="20.0" rx="3" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="293.0" y="178.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">Gene X</text>
  <line x1="220.0" y1="140.0" x2="234.0" y2="162.0" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="234.0" y1="140.0" x2="220.0" y2="162.0" stroke="#e11d48" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="198.0" y1="194.0" x2="198.0" y2="218.0" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-rose)"/>
  <rect x="42.0" y="226.0" width="312.0" height="42.0" rx="6" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="198.0" y="243.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#085f55" text-anchor="middle">Product 1: DUPLICATION (2 copies of Gene X)</text>
  <text x="198.0" y="259.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">e.g. Charcot–Marie–Tooth 1A (PMP22 dup)</text>
  <rect x="42.0" y="278.0" width="312.0" height="42.0" rx="6" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="198.0" y="295.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="700" fill="#9f1239" text-anchor="middle">Product 2: DELETION (0 copies of Gene X)</text>
  <text x="198.0" y="311.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">e.g. 22q11.2 DiGeorge / HNPP deletion</text>
  <rect x="388.0" y="72.0" width="348.0" height="264.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="400.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Inverted repeats (→ ... ←) → Intrachromosomal inversion</text>
  <path d="M 426 206 L 496 206 C 538 206, 538 118, 594 118 C 650 118, 650 206, 610 206 L 696 206" fill="none" stroke="#0f172a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="504.0" y="184.0" width="46.0" height="20.0" rx="3" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="527.0" y="198.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">SD →</text>
  <rect x="584.0" y="184.0" width="46.0" height="20.0" rx="3" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="607.0" y="198.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">← SD</text>
  <rect x="550.0" y="108.0" width="86.0" height="22.0" rx="11.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="593.0" y="122.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#7c3aed" text-anchor="middle">A — B — C</text>
  <line x1="554.0" y1="190.0" x2="580.0" y2="198.0" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <line x1="554.0" y1="198.0" x2="580.0" y2="190.0" stroke="#e11d48" stroke-width="2" stroke-linecap="round"/>
  <line x1="562.0" y1="218.0" x2="562.0" y2="242.0" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-purple)"/>
  <rect x="406.0" y="250.0" width="312.0" height="68.0" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="562.0" y="270.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#7c3aed" text-anchor="middle">Product: BALANCED INVERSION (C — B — A)</text>
  <text x="562.0" y="285.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#7c3aed" text-anchor="middle">No DNA gained or lost — total copy number = 2,</text>
  <text x="562.0" y="300.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#7c3aed" text-anchor="middle">but breakpoints can split genes (e.g. Factor VIII in haemophilia A)!</text>
</svg>
