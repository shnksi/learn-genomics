<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">De Bruijn assembly graphs and why repeats break short-read contigs</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Short k-mers collapse identical repeat copies into one node, leaving an ambiguous fork that only long reads span</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="464.0" height="266.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Collapsed repeat tangle in a De Bruijn graph (A–R–B and C–R–D)</text>
  <rect x="48.0" y="126.0" width="86.0" height="42.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="91.0" y="151.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">Unique A</text>
  <rect x="48.0" y="226.0" width="86.0" height="42.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="91.0" y="251.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Unique C</text>
  <rect x="196.0" y="172.0" width="118.0" height="52.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="255.0" y="192.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">Repeat R</text>
  <text x="255.0" y="208.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">(2× coverage!)</text>
  <rect x="378.0" y="126.0" width="86.0" height="42.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="421.0" y="151.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">Unique B</text>
  <rect x="378.0" y="226.0" width="86.0" height="42.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="421.0" y="251.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Unique D</text>
  <line x1="136.0" y1="148.0" x2="194.0" y2="188.0" stroke="#0d8a7b" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <line x1="136.0" y1="246.0" x2="194.0" y2="210.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <line x1="316.0" y1="188.0" x2="374.0" y2="148.0" stroke="#0d8a7b" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <line x1="316.0" y1="210.0" x2="374.0" y2="246.0" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <text x="255.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">Ambiguity: Is the genome (A→R→B, C→R→D) or (A→R→D, C→R→B)?</text>
  <text x="255.0" y="316.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">Short-read assemblers MUST break into 5 separate contigs here!</text>
  <rect x="506.0" y="72.0" width="230.0" height="266.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="518.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Why long reads finish genomes</text>
  <text x="522.0" y="118.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="start">Short reads (150 bp &lt; |R|):</text>
  <line x1="522.0" y1="134.0" x2="574.0" y2="134.0" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <line x1="586.0" y1="134.0" x2="638.0" y2="134.0" stroke="#e11d48" stroke-width="3" stroke-linecap="round"/>
  <text x="522.0" y="156.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="start">Trapped inside repeat R.</text>
  <text x="522.0" y="198.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="start">Long HiFi / ONT read (&gt; |R|):</text>
  <rect x="522.0" y="210.0" width="44.0" height="18.0" rx="3" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="544.0" y="223.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">A</text>
  <rect x="566.0" y="210.0" width="96.0" height="18.0" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="614.0" y="223.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#9f1239" text-anchor="middle">Repeat R</text>
  <rect x="662.0" y="210.0" width="44.0" height="18.0" rx="3" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="684.0" y="223.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">B</text>
  <text x="522.0" y="254.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Single molecule physically</text>
  <text x="522.0" y="269.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">anchors A directly to B,</text>
  <text x="522.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">untangling the graph into</text>
  <text x="522.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">telomere-to-telomere contigs.</text>
</svg>
