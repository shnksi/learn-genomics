  <text x="186.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="end">Allium cepa (onion)</text>
  <rect x="196.0" y="234.0" width="311.1" height="18.0" rx="4" fill="#c25e0a" stroke="none" stroke-width="1.2"/>
