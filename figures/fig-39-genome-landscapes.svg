  <text x="186.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#0f172a" text-anchor="end">Protopterus (lungfish)</text>
  <rect x="196.0" y="264.0" width="342.9" height="18.0" rx="4" fill="#c25e0a" stroke="none" stroke-width="1.2"/>
  <text x="546.9" y="277.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">43000 Mb · Massive repeat expansion</text>
  <text x="380.0" y="338.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">Resolution: C-value varies by repeat/transposon accumulation; G-value complexity comes from regulation &amp; alternative splicing.</text>
