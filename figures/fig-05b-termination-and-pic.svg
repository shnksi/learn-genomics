  <text x="252.0" y="230.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#9f1239" text-anchor="middle">U-U-U-U-U-U-3′</text>
  <line x1="204.0" y1="248.0" x2="300.0" y2="248.0" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>
  <text x="252.0" y="264.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">A-A-A-A-A-A (DNA)</text>
  <text x="192.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Hairpin snaps shut inside exit channel → stalls Pol;</text>
  <text x="192.0" y="308.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">weak rU:dA base pairs melt spontaneously → RNA releases.</text>
