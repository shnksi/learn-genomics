  <path d="M 74 226 L 146 226 L 146 146 C 146 116, 194 116, 194 146 L 194 226 L 288 226" fill="none" stroke="#0d8a7b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
