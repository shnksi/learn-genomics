  <circle cx="486.0" cy="130.0" r="7.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="486.0" y="133.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#9f1239" text-anchor="middle">P</text>
  <circle cx="466.0" cy="136.0" r="7.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.3"/>
  <text x="466.0" y="139.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8" font-weight="700" fill="#9f1239" text-anchor="middle">P</text>
  <text x="448.0" y="118.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#9f1239" text-anchor="start">CTD tail (Ser5-P)</text>
  <text x="557.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">1. TFIID (TBP) bends TATA box → recruits TFIIB &amp; Pol II.</text>
  <text x="557.0" y="293.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">2. TFIIH melts DNA (helicase) &amp; phosphorylates CTD tail.</text>
  <text x="557.0" y="308.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">3. Phospho-CTD releases Pol II &amp; recruits capping/splicing!</text>
