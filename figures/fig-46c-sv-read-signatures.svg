  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="365.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">How structural variants (SVs) are detected from short-read WGS</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Combining three orthogonal signals — read depth, discordant pairs, and split reads — resolves deletions, duplications, and inversions</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="712.0" height="162.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Anatomy of a heterozygous deletion (50 kb) across three WGS read signals</text>
  <text x="42.0" y="124.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#1e40af" text-anchor="start">1. Read Depth</text>
  <polyline points="172.0,108.0 330.0,108.0 330.0,130.0 520.0,130.0 520.0,108.0 706.0,108.0" fill="none" stroke="#2563eb" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="425.0" y="124.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9f1239" text-anchor="middle">50% depth drop (het del)</text>
  <text x="42.0" y="168.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#c25e0a" text-anchor="start">2. Discordant Pairs</text>
  <rect x="256.0" y="158.0" width="56.0" height="12.0" rx="2" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.5"/>
  <line x1="312.0" y1="164.0" x2="536.0" y2="164.0" stroke="#c25e0a" stroke-width="2.0" stroke-linecap="round" stroke-dasharray="4,3"/>
  <rect x="536.0" y="158.0" width="56.0" height="12.0" rx="2" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.5"/>
  <text x="425.0" y="156.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">Insert spans 50 kb (&gt;&gt; 350 bp expected!)</text>
  <text x="42.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="700" fill="#085f55" text-anchor="start">3. Split Reads</text>
  <rect x="294.0" y="196.0" width="36.0" height="12.0" rx="2" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <line x1="330.0" y1="202.0" x2="520.0" y2="202.0" stroke="#0d8a7b" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2,2"/>
  <rect x="520.0" y="196.0" width="36.0" height="12.0" rx="2" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="425.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#085f55" text-anchor="middle">Exact 1-bp breakpoint resolution!</text>
  <line x1="330.0" y1="98.0" x2="330.0" y2="220.0" stroke="#e11d48" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="520.0" y1="98.0" x2="520.0" y2="220.0" stroke="#e11d48" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="3,3"/>
  <rect x="24.0" y="248.0" width="166.0" height="94.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="107.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="middle">Deletion</text>
  <text x="107.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Depth: ↓ (0.5× / 0×)</text>
  <text x="107.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Pairs: stretched insert</text>
  <rect x="206.0" y="248.0" width="166.0" height="94.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="289.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">Tandem Dup</text>
  <text x="289.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Depth: ↑ (1.5× / 2×)</text>
  <text x="289.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Pairs: outward ← →</text>
  <rect x="388.0" y="248.0" width="166.0" height="94.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="471.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Inversion</text>
  <text x="471.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Depth: unchanged (1×)</text>
  <text x="471.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Pairs: same-strand → →</text>
  <rect x="570.0" y="248.0" width="166.0" height="94.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="653.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">Translocation</text>
  <text x="653.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Depth: unchanged (1×)</text>
  <text x="653.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Pairs: chrA ↔ chrB</text>
