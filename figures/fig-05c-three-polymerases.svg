<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 345" width="760" height="345" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="345.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">The three eukaryotic RNA polymerases: division of labour</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Unlike bacteria (one core RNA Pol), eukaryotes split rRNA, mRNA, and tRNA across three dedicated enzymes</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="76.0" width="224.0" height="246.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="136.0" y="102.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">RNA Pol I</text>
  <rect x="52.0" y="114.0" width="168.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="136.0" y="128.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Location: Nucleolus</text>
  <text x="136.0" y="158.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Transcribes: 45S pre-rRNA</text>
  <text x="136.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">(processed into 28S, 18S, 5.8S)</text>
  <text x="136.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">~50–70% of all cellular RNA</text>
  <text x="136.0" y="222.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">synthesis by mass!</text>
  <text x="136.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">No CTD tail · no capping</text>
  <rect x="268.0" y="76.0" width="224.0" height="246.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.6"/>
  <text x="380.0" y="102.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d8a7b" text-anchor="middle">RNA Pol II</text>
  <rect x="296.0" y="114.0" width="168.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="380.0" y="128.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Location: Nucleoplasm</text>
  <text x="380.0" y="158.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Transcribes: ALL protein-coding</text>
  <text x="380.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">mRNAs + miRNAs, lncRNAs, snRNAs</text>
  <text x="380.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Carries long phosphorylated CTD</text>
  <text x="380.0" y="222.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">tail coordinating 5′ cap, splicing,</text>
  <text x="380.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">and 3′ polyadenylation!</text>
  <rect x="512.0" y="76.0" width="224.0" height="246.0" rx="10" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.6"/>
  <text x="624.0" y="102.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#c25e0a" text-anchor="middle">RNA Pol III</text>
  <rect x="540.0" y="114.0" width="168.0" height="22.0" rx="11.0" fill="#ffffff" stroke="#c25e0a" stroke-width="1.2"/>
  <text x="624.0" y="128.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Location: Nucleoplasm</text>
  <text x="624.0" y="158.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Transcribes: tRNAs, 5S rRNA,</text>
  <text x="624.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">U6 snRNA, 7SL RNA, Alu repeats</text>
  <text x="624.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Short structured RNAs;</text>
  <text x="624.0" y="222.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">often uses INTERNAL promoters</text>
  <text x="624.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">(downstream of +1 TSS!)</text>
</svg>
