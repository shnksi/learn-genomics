  <polyline points="72.0,261.6 112.9,261.6 136.2,240.8 156.7,167.7 174.2,122.4 194.6,178.1 218.0,247.7 241.4,277.3 270.6,272.1 311.4,261.6 364.0,261.6" fill="none" stroke="#0d8a7b" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round"/>
