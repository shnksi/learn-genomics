  <text x="203.4" y="171.2" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="start">K⁺ out</text>
  <text x="258.9" y="270.3" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#7c3aed" text-anchor="start">Refractory</text>
  <rect x="402.0" y="72.0" width="334.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="414.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Chemical synapse &amp; Purkinje firing load</text>
  <rect x="418.0" y="106.0" width="302.0" height="102.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="569.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="middle">Presynaptic → Postsynaptic relay</text>
  <text x="569.0" y="142.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">1. Spike opens voltage-gated Ca²⁺ channels.</text>
  <text x="569.0" y="156.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">2. Ca²⁺ triggers SNARE vesicle fusion.</text>
  <text x="569.0" y="170.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">3. Glutamate → excitatory (Na⁺/Ca²⁺ in);</text>
  <text x="569.0" y="184.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">   GABA → inhibitory (Cl⁻ in, hyperpolarises).</text>
  <rect x="418.0" y="222.0" width="302.0" height="104.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="569.0" y="242.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Why Purkinje neurons live on a knife-edge</text>
  <text x="569.0" y="258.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">• Autonomous pacemaking at 40–100 Hz nonstop.</text>
  <text x="569.0" y="272.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">• Climbing-fibre complex spikes flood dendrites</text>
  <text x="569.0" y="286.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">  with massive Ca²⁺ transients every second.</text>
  <text x="569.0" y="300.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">• ATP/mitochondrial failure (e.g. Bβ2!) is lethal.</text>
