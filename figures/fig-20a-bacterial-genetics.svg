  <rect x="24.0" y="76.0" width="166.0" height="178.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="107.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">1. Transformation</text>
  <line x1="38.0" y1="108.0" x2="176.0" y2="108.0" stroke="#0d8a7b" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <text x="107.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Uptake of naked DNA</text>
  <text x="107.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">from environment</text>
  <text x="107.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Proved DNA = genetic</text>
  <text x="107.0" y="194.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">material (Avery 1944)</text>
  <rect x="206.0" y="76.0" width="166.0" height="178.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="289.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">2. Conjugation (Hfr)</text>
  <line x1="220.0" y1="108.0" x2="358.0" y2="108.0" stroke="#2563eb" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <text x="289.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Pilus transfers linear</text>
  <text x="289.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">chromosome from oriT</text>
  <text x="289.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Interrupted mating maps</text>
  <text x="289.0" y="194.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">genes in minutes!</text>
  <rect x="388.0" y="76.0" width="166.0" height="178.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="471.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle">3. Transduction</text>
  <line x1="402.0" y1="108.0" x2="540.0" y2="108.0" stroke="#7c3aed" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <text x="471.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Bacteriophage carries</text>
  <text x="471.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">bacterial DNA:</text>
  <text x="471.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Generalized (random)</text>
  <text x="471.0" y="194.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Specialized (near att)</text>
  <rect x="570.0" y="76.0" width="166.0" height="178.0" rx="10" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.5"/>
  <text x="653.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c25e0a" text-anchor="middle">4. Complementation</text>
  <line x1="584.0" y1="108.0" x2="722.0" y2="108.0" stroke="#c25e0a" stroke-width="0.8" stroke-linecap="round" opacity="0.4"/>
  <text x="653.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Merodiploid (m1/m2):</text>
  <text x="653.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Wild-type → 2 genes</text>
  <text x="653.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">Mutant → same gene</text>
  <text x="653.0" y="194.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#0f172a" text-anchor="middle">(or cis-acting site)</text>
  <rect x="24.0" y="274.0" width="712.0" height="66.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="38.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">Complementation logic:</text>
  <text x="190.0" y="296.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#085f55" text-anchor="start">m1⁻ m2⁺  /  m1⁺ m2⁻  (trans)</text>
  <text x="430.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="start">→  Both good proteins exist → Wild-type (+)</text>
  <text x="190.0" y="322.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#9f1239" text-anchor="start">m1a⁻  /  m1b⁻  (same gene)</text>
  <text x="430.0" y="322.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#9f1239" text-anchor="start">→  Zero functional copies → Mutant (−)</text>
</svg>
