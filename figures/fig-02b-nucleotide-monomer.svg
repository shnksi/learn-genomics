  <text x="446.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="start">Pyrimidines — 1 six-membered ring (C, T, U)</text>
  <polygon points="482.0,260.0 500.0,250.0 518.0,260.0 518.0,282.0 500.0,292.0 482.0,282.0" fill="#ffffff" stroke="#c25e0a" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="540.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">Cytosine (C) · Thymine (T in DNA)</text>
  <text x="540.0" y="277.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">Uracil (U in RNA, lacks 5-methyl)</text>
  <text x="540.0" y="292.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">Methyl tag lets repair flag U in DNA!</text>
