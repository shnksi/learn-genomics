  <text x="318.0" y="292.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#9f1239" text-anchor="middle">2′-OH → RNA (prone to</text>
  <text x="318.0" y="305.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#9f1239" text-anchor="middle">   base-catalysed hydrolysis)</text>
