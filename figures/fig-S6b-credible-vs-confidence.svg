  <circle cx="184.0" cy="234.0" r="3.8" fill="#0d8a7b" stroke="none" stroke-width="1.5"/>
  <text x="288.0" y="193.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#9f1239" text-anchor="start">Miss!</text>
  <text x="196.0" y="272.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">θ is FIXED (not random); the interval jumps across repeats.</text>
  <text x="196.0" y="287.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">95% of repeated samples produce intervals bracketing θ.</text>
  <text x="196.0" y="302.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">You CANNOT say &#x27;P(θ ∈ this CI) = 95%&#x27; strictly!</text>
