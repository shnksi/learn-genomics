  <text x="566.0" y="256.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">Parameter θ (given observed data D)</text>
  <text x="564.0" y="276.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">Data D are FIXED; posterior P(θ | D) quantifies belief in θ.</text>
  <text x="564.0" y="291.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.1" font-weight="500" fill="#334155" text-anchor="middle">Directly licenses: &#x27;Given data + prior, P(θ ∈ [a, b]) = 95%.&#x27;</text>
