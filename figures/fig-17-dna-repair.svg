<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="365.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">The five DNA repair pathways matched to their lesion</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Every single-strand repair exploits the intact complementary strand; double-strand breaks force a harder choice</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="74.0" width="184.0" height="44.0" rx="7" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="116.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">BER (Base Excision)</text>
  <rect x="222.0" y="74.0" width="168.0" height="44.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="306.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">Small base damage</text>
  <text x="306.0" y="106.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">(uracil, 8-oxoG)</text>
  <line x1="392.0" y1="96.0" x2="418.0" y2="96.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="422.0" y="74.0" width="314.0" height="44.0" rx="7" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="434.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Glycosylase clips base → AP endonuclease → Pol β → Ligase</text>
  <rect x="24.0" y="128.0" width="184.0" height="44.0" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="116.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">NER (Nucleotide Excision)</text>
  <rect x="222.0" y="128.0" width="168.0" height="44.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="306.0" y="146.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">Bulky helix distortions</text>
  <text x="306.0" y="160.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">(UV pyrimidine dimers)</text>
  <line x1="392.0" y1="150.0" x2="418.0" y2="150.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="422.0" y="128.0" width="314.0" height="44.0" rx="7" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="434.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Excises ~25–30 nt oligomer around lesion → Pol δ/ε fills gap</text>
  <rect x="24.0" y="182.0" width="184.0" height="44.0" rx="7" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="116.0" y="208.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed" text-anchor="middle">MMR (Mismatch Repair)</text>
  <rect x="222.0" y="182.0" width="168.0" height="44.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="306.0" y="200.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">Replication errors &amp;</text>
  <text x="306.0" y="214.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">small slippage loops</text>
  <line x1="392.0" y1="204.0" x2="418.0" y2="204.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="422.0" y="182.0" width="314.0" height="44.0" rx="7" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="434.0" y="208.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">MSH2/6 or MSH2/3 detects mismatch → nicked new strand excised</text>
  <rect x="24.0" y="236.0" width="184.0" height="44.0" rx="7" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.5"/>
  <text x="116.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="middle">DSB · NHEJ (fast, any phase)</text>
  <rect x="222.0" y="236.0" width="168.0" height="44.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="306.0" y="254.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">Double-strand break</text>
  <text x="306.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">(no template used)</text>
  <line x1="392.0" y1="258.0" x2="418.0" y2="258.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="422.0" y="236.0" width="314.0" height="44.0" rx="7" fill="#ffffff" stroke="#c25e0a" stroke-width="1.2"/>
  <text x="434.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Ku70/80 binds ends → ligates directly → small indels / scars</text>
  <rect x="24.0" y="290.0" width="184.0" height="44.0" rx="7" fill="#ecfdf5" stroke="#15803d" stroke-width="1.5"/>
  <text x="116.0" y="316.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">DSB · HDR (S/G2 phase)</text>
  <rect x="222.0" y="290.0" width="168.0" height="44.0" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="306.0" y="308.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">Double-strand break</text>
  <text x="306.0" y="322.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#0f172a" text-anchor="middle">(sister chromatid copy)</text>
  <line x1="392.0" y1="312.0" x2="418.0" y2="312.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="422.0" y="290.0" width="314.0" height="44.0" rx="7" fill="#ffffff" stroke="#15803d" stroke-width="1.2"/>
  <text x="434.0" y="316.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">5′ resection → RAD51 invades sister chromatid → exact repair</text>
</svg>
