  <line x1="480.0" y1="174.0" x2="554.0" y2="174.0" stroke="#0d8a7b" stroke-width="4" stroke-linecap="round"/>
  <line x1="554.0" y1="174.0" x2="554.0" y2="220.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="570.0" y1="220.0" x2="570.0" y2="174.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="570.0" y1="174.0" x2="644.0" y2="174.0" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <text x="470.0" y="169.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#085f55" text-anchor="end">N1</text>
  <text x="654.0" y="169.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#1e40af" text-anchor="start">N2</text>
  <text x="562.0" y="106.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#085f55" text-anchor="middle">T1</text>
  <text x="562.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#1e40af" text-anchor="middle">T2</text>
  <rect x="404.0" y="240.0" width="316.0" height="88.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="562.0" y="260.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Two main Meiosis I segregation modes</text>
  <text x="562.0" y="276.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">• Alternate (N1+N2 vs T1+T2): 100% balanced gametes!</text>
  <text x="562.0" y="290.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">• Adjacent-1 (N1+T2 vs T1+N2): partial trisomy + monosomy</text>
  <text x="562.0" y="304.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">  → recurrent miscarriage or congenital anomaly.</text>
