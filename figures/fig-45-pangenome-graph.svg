  <text x="217.0" y="241.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">SNP: A</text>
