  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Linear reference bias vs. a pangenome variation graph</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">A single linear reference drops reads carrying non-reference alleles; a pangenome graph encodes all haplotypes as paths</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="712.0" height="110.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#9f1239" text-anchor="start">Linear reference genome (GRCh38): reference bias at structural variants &amp; divergent alleles</text>
  <line x1="48.0" y1="128.0" x2="712.0" y2="128.0" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="280.0" y="114.0" width="130.0" height="28.0" rx="5" fill="#ffffff" stroke="#e11d48" stroke-width="1.6"/>
  <text x="345.0" y="132.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Ref allele only</text>
  <text x="380.0" y="164.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" fill="#334155" text-anchor="middle">Reads carrying a novel 2 kb insertion or alternate haplotype fail to align or get penalized → systematic reference bias.</text>
  <rect x="24.0" y="200.0" width="712.0" height="138.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="36.0" y="220.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Pangenome graph (HPRC): shared conserved spine with branching SNP &amp; structural-variant bubbles</text>
  <rect x="46.0" y="250.0" width="90.0" height="36.0" rx="8" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.4"/>
