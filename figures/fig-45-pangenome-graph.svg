  <text x="342.0" y="272.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#085f55" text-anchor="middle">Conserved</text>
  <path d="M 388 268 C 408 268, 414 236, 444 236" fill="none" stroke="#c25e0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 388 268 L 594 268" fill="none" stroke="#0d8a7b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="444.0" y="224.0" width="114.0" height="24.0" rx="12.0" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.2"/>
  <text x="501.0" y="239.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c25e0a" text-anchor="middle">+2 kb Insertion</text>
  <path d="M 558 236 C 578 236, 582 268, 594 268" fill="none" stroke="#c25e0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="594.0" y="250.0" width="118.0" height="36.0" rx="8" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="653.0" y="272.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#085f55" text-anchor="middle">Conserved →</text>
  <text x="380.0" y="326.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#085f55" text-anchor="middle">Every individual&#x27;s haplotype is a walk through the graph — eliminating reference bias across global ancestries.</text>
</svg>
