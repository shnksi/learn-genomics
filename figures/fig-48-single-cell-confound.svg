  <text x="380.0" y="314.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">400 PCR duplicates sharing the same (CB, UMI, gene) collapse to count = 1 molecule!</text>
