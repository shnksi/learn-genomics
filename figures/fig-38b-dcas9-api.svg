<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">dCas9 as a programmable genomic API (no DNA cutting)</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Disabling both nuclease domains (D10A + H840A) turns Cas9 into a guide-addressed delivery vehicle for any effector</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <line x1="44.0" y1="152.0" x2="716.0" y2="152.0" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="306.0" y="108.0" width="148.0" height="56.0" rx="14" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="2.2"/>
  <text x="380.0" y="132.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="middle">dCas9 + sgRNA</text>
  <text x="380.0" y="149.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">(binds 20 bp + PAM, no cut)</text>
  <line x1="380.0" y1="166.0" x2="107.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="24.0" y="202.0" width="166.0" height="132.0" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.6"/>
  <text x="107.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#e11d48" text-anchor="middle">CRISPRi (Silencing)</text>
  <text x="107.0" y="241.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0f172a" text-anchor="middle">Fused to KRAB repressor</text>
  <text x="107.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Recruits H3K9me3 + KAP1</text>
  <text x="107.0" y="279.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">to shut down enhancers or</text>
  <text x="107.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">genes reversibly.</text>
  <line x1="380.0" y1="166.0" x2="289.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="206.0" y="202.0" width="166.0" height="132.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.6"/>
  <text x="289.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#0d8a7b" text-anchor="middle">CRISPRa (Activation)</text>
  <text x="289.0" y="241.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0f172a" text-anchor="middle">Fused to VP64 / p300</text>
  <text x="289.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Recruits Pol II or writes</text>
  <text x="289.0" y="279.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">H3K27ac to activate silent</text>
  <text x="289.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">promoters on demand.</text>
  <line x1="380.0" y1="166.0" x2="471.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="388.0" y="202.0" width="166.0" height="132.0" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="471.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#7c3aed" text-anchor="middle">Epigenome Editing</text>
  <text x="471.0" y="241.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0f172a" text-anchor="middle">Fused to DNMT3A / TET1</text>
  <text x="471.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Writes or erases CpG</text>
  <text x="471.0" y="279.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">methylation at targeted</text>
  <text x="471.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">regulatory elements.</text>
  <line x1="380.0" y1="166.0" x2="653.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="570.0" y="202.0" width="166.0" height="132.0" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="653.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#2563eb" text-anchor="middle">Imaging &amp; Proteomics</text>
  <text x="653.0" y="241.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0f172a" text-anchor="middle">Fused to GFP / APEX2</text>
  <text x="653.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Tracks live 3D locus motion</text>
  <text x="653.0" y="279.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">or biotinylates local proteins</text>
  <text x="653.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">bound at one enhancer.</text>
</svg>
