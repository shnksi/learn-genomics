<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Population substructure (the Wahlund effect) and F_ST</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Pooling two subpopulations with different allele frequencies creates a deficit of heterozygotes even when each is in HWE</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="80.0" width="196.0" height="114.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="122.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#085f55" text-anchor="middle">Subpopulation 1 (HWE)</text>
  <text x="122.0" y="116.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">p₁ = 0.10,  q₁ = 0.90</text>
  <text x="122.0" y="130.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">AA = 0.01  |  aa = 0.81</text>
  <text x="122.0" y="144.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Heterozygotes 2p₁q₁ = 0.18</text>
  <rect x="24.0" y="214.0" width="196.0" height="114.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="122.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c25e0a" text-anchor="middle">Subpopulation 2 (HWE)</text>
  <text x="122.0" y="250.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">p₂ = 0.90,  q₂ = 0.10</text>
  <text x="122.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">AA = 0.81  |  aa = 0.01</text>
  <text x="122.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Heterozygotes 2p₂q₂ = 0.18</text>
  <line x1="224.0" y1="136.0" x2="286.0" y2="186.0" stroke="#0d8a7b" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <line x1="224.0" y1="270.0" x2="286.0" y2="224.0" stroke="#c25e0a" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-amber)"/>
  <rect x="292.0" y="80.0" width="444.0" height="248.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="304.0" y="100.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">50 / 50 Pooled sample (mean p̄ = 0.50)</text>
  <text x="312.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">Expected under single HWE (H_T = 2p̄q̄):</text>
  <rect x="312.0" y="138.0" width="360.0" height="26.0" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="492.0" y="155.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">0.50  (50% heterozygotes)</text>
  <text x="312.0" y="192.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">Actual observed in pool (H_S = mean 2pᵢqᵢ):</text>
  <rect x="312.0" y="202.0" width="130.0" height="26.0" rx="5" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="377.0" y="219.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#9f1239" text-anchor="middle">0.18</text>
  <rect x="444.0" y="202.0" width="228.0" height="26.0" rx="5" fill="#f1f5f9" stroke="#e11d48" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="558.0" y="219.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">Missing 0.32 (Wahlund deficit!)</text>
  <rect x="312.0" y="250.0" width="404.0" height="60.0" rx="8" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="514.0" y="274.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="middle">F_ST  =  (H_T − H_S) / H_T  =  (0.50 − 0.18) / 0.50  =  0.64</text>
  <text x="514.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" fill="#334155" text-anchor="middle">F_ST is the fraction of total allele-frequency variance BETWEEN groups.</text>
</svg>
