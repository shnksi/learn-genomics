  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Sticky ends paste a gene into a selectable plasmid vector; qPCR measures starting template by when fluorescence crosses threshold</text>
