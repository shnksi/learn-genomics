  <rect x="388.0" y="198.0" width="166.0" height="140.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="471.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c25e0a" text-anchor="middle">Dominant negative</text>
  <text x="471.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">Mutant subunit poisons</text>
  <text x="471.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">multi-subunit complex</text>
  <text x="471.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">(e.g. collagen / dimers)</text>
  <rect x="406.0" y="312.0" width="130.0" height="12.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
