  <rect x="206.0" y="198.0" width="166.0" height="140.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="289.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">Haploinsufficiency</text>
  <text x="289.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">50% protein is NOT enough</text>
  <text x="289.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">(dosage-sensitive TFs)</text>
  <text x="289.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">Dominant phenotype</text>
