  <text x="480.0" y="322.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#c25e0a" text-anchor="middle">&lt;25% active</text>
  <rect x="570.0" y="198.0" width="166.0" height="140.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="653.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e11d48" text-anchor="middle">Gain of function</text>
  <text x="653.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">Constitutively active or</text>
  <text x="653.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">toxic new aggregation</text>
  <text x="653.0" y="262.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="middle">(e.g. oncogenes, repeats)</text>
  <rect x="588.0" y="312.0" width="130.0" height="12.0" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="588.0" y="312.0" width="130.0" height="12.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.2"/>
  <text x="653.0" y="322.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#ffffff" text-anchor="middle">Hyperactive / toxic</text>
