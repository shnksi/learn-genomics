<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">The neurodegeneration proteostasis toolbox in post-mitotic neurons</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Because mature neurons cannot divide to dilute damaged proteins or mitochondria, they depend on three clearance arms</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="216.0" y="74.0" width="328.0" height="30.0" rx="15.0" fill="#fff1f2" stroke="#e11d48" stroke-width="1.2"/>
  <text x="380.0" y="92.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9f1239" text-anchor="middle">Misfolded protein / Damaged mitochondrion (aging neuron)</text>
  <line x1="280.0" y1="106.0" x2="136.0" y2="136.0" stroke="#0d8a7b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <line x1="380.0" y1="106.0" x2="380.0" y2="136.0" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-blue)"/>
  <line x1="480.0" y1="106.0" x2="624.0" y2="136.0" stroke="#c25e0a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-amber)"/>
  <rect x="24.0" y="140.0" width="224.0" height="122.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="136.0" y="160.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">1. Chaperone Refolding</text>
  <text x="136.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">Hsp70 / Hsp90 / TRiC rescue</text>
  <text x="136.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">partially folded intermediates</text>
  <text x="136.0" y="204.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">before hydrophobic surfaces</text>
  <text x="136.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">clump into toxic oligomers.</text>
  <rect x="268.0" y="140.0" width="224.0" height="122.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380.0" y="160.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">2. Ubiquitin–Proteasome (UPS)</text>
  <text x="380.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">E1–E2–E3 ligases attach K48</text>
  <text x="380.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">poly-ubiquitin chains → 26S</text>
  <text x="380.0" y="204.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">proteasome unfolds &amp; shreds</text>
  <text x="380.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">soluble monomers only.</text>
  <rect x="512.0" y="140.0" width="224.0" height="122.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="624.0" y="160.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="middle">3. Autophagy &amp; Mitophagy</text>
  <text x="624.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">Double-membrane autophagosome</text>
  <text x="624.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">engulfs large aggregates &amp;</text>
  <text x="624.0" y="204.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">fissioned mitochondria (PINK1/</text>
  <text x="624.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.4" font-weight="500" fill="#334155" text-anchor="middle">Parkin) → fuses with lysosome.</text>
  <rect x="24.0" y="278.0" width="712.0" height="60.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="380.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">When clearance saturates in Purkinje or motor neurons:</text>
  <text x="380.0" y="318.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.6" font-weight="500" fill="#334155" text-anchor="middle">Aggregates + fragmented mitochondria → ATP collapse + Ca²⁺ excitotoxicity + ER stress (UPR) → selective neuronal death.</text>
</svg>
