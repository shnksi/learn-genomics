  <text x="91.0" y="318.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">X (~155 Mb)</text>
  <text x="91.0" y="332.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">~850 genes</text>
  <rect x="198.0" y="152.0" width="34.0" height="110.0" rx="16" fill="#fff3e5" stroke="#c25e0a" stroke-width="2"/>
  <rect x="198.0" y="152.0" width="34.0" height="20.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="198.0" y="242.0" width="34.0" height="20.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <rect x="198.0" y="178.0" width="34.0" height="14.0" rx="2" fill="#e11d48" stroke="none" stroke-width="1.2"/>
  <text x="242.0" y="189.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#9f1239" text-anchor="start" font-style="italic">SRY</text>
  <text x="215.0" y="282.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="middle">Y (~57 Mb)</text>
  <text x="215.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#64748b" text-anchor="middle">~50 protein genes</text>
  <text x="146.0" y="124.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PAR1</text>
  <line x1="110.0" y1="120.0" x2="196.0" y2="160.0" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <text x="146.0" y="266.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">PAR2</text>
  <line x1="110.0" y1="286.0" x2="196.0" y2="252.0" stroke="#7c3aed" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,2"/>
  <rect x="334.0" y="72.0" width="402.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="346.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">X-linked recessive cross: Carrier mother (X⁺X⁻) × Unaffected father (X⁺Y)</text>
  <rect x="384.0" y="108.0" width="116.0" height="42.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="442.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#085f55" text-anchor="middle">Mother X⁺X⁻</text>
  <text x="442.0" y="144.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Carrier (unaffected)</text>
  <rect x="570.0" y="108.0" width="116.0" height="42.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="628.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">Father X⁺Y</text>
  <text x="628.0" y="144.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Unaffected</text>
  <line x1="500.0" y1="129.0" x2="570.0" y2="129.0" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="535.0" y1="129.0" x2="535.0" y2="174.0" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="392.0" y1="174.0" x2="678.0" y2="174.0" stroke="#334155" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="394.0" y1="174.0" x2="394.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="356.0" y="198.0" width="76.0" height="66.0" rx="8" fill="#ecfdf5" stroke="#15803d" stroke-width="1.4"/>
  <text x="394.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">X⁺X⁺</text>
  <text x="394.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Unaffected</text>
  <text x="394.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">daughter</text>
  <line x1="488.0" y1="174.0" x2="488.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="450.0" y="198.0" width="76.0" height="66.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="488.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">X⁺X⁻</text>
  <text x="488.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Carrier</text>
  <text x="488.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">daughter</text>
  <line x1="582.0" y1="174.0" x2="582.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="544.0" y="198.0" width="76.0" height="66.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="582.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">X⁺Y</text>
  <text x="582.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Unaffected</text>
  <text x="582.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">son</text>
  <line x1="676.0" y1="174.0" x2="676.0" y2="198.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="638.0" y="198.0" width="76.0" height="66.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="676.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#e11d48" text-anchor="middle">X⁻Y</text>
  <text x="676.0" y="234.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Affected</text>
  <text x="676.0" y="248.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">son (50%)</text>
  <text x="535.0" y="294.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Key rule: Father gives Y to sons and X to all daughters.</text>
  <text x="535.0" y="310.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" fill="#334155" text-anchor="middle">Therefore an affected father NEVER transmits X-linked traits to sons.</text>
</svg>
