  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Human X and Y chromosomes and X-linked recessive inheritance</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Because XY males carry a single X (hemizygous), a single recessive allele is expressed — and never passes father-to-son</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="290.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">X vs Y chromosome structure</text>
  <rect x="74.0" y="108.0" width="34.0" height="190.0" rx="16" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="2"/>
  <rect x="74.0" y="108.0" width="34.0" height="22.0" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
