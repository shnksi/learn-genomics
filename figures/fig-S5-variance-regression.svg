  <rect x="496.0" y="114.0" width="226.0" height="36.0" rx="6" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="609.0" y="136.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">Σ(y−ȳ)² = Σ(ŷ−ȳ)² + Σ(y−ŷ)²</text>
  <text x="498.0" y="174.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">R² = Explained / Total = r²</text>
  <text x="498.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Slope β̂ = Cov(X, Y) / Var(X)</text>
  <text x="498.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">Warning: r measures ONLY linear</text>
