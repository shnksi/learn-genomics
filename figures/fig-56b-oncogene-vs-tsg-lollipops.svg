  <text x="686.0" y="153.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="500" fill="#334155" text-anchor="end">(breaking the protein kills oncogenicity!)</text>
