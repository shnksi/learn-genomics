<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">CRISPR-Cas as bacterial adaptive immunity (the three natural stages)</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Long before genome editing, bacteria evolved CRISPR arrays as heritable molecular mugshots of past bacteriophage infections</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="76.0" width="224.0" height="152.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="136.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#c25e0a" text-anchor="middle">1. Adaptation (Memory)</text>
  <text x="136.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Phage injects viral DNA.</text>
  <text x="136.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Cas1–Cas2 excises a ~30 bp</text>
  <text x="136.0" y="140.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">protospacer next to a PAM</text>
  <text x="136.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">and pastes it as a new</text>
  <text x="136.0" y="168.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">spacer into the CRISPR array.</text>
  <line x1="250.0" y1="152.0" x2="266.0" y2="152.0" stroke="#334155" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="268.0" y="76.0" width="224.0" height="152.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="380.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#2563eb" text-anchor="middle">2. Expression (Processing)</text>
  <text x="380.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">The repeat–spacer array is</text>
  <text x="380.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">transcribed as long pre-crRNA</text>
  <text x="380.0" y="140.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">and cleaved into individual</text>
  <text x="380.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">mature crRNAs (each carrying</text>
  <text x="380.0" y="168.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">one viral spacer sequence).</text>
  <line x1="494.0" y1="152.0" x2="510.0" y2="152.0" stroke="#334155" stroke-width="2.0" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="512.0" y="76.0" width="224.0" height="152.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="624.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#0d8a7b" text-anchor="middle">3. Interference (Defence)</text>
  <text x="624.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Mature crRNA loads into a</text>
  <text x="624.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Cas nuclease (e.g. Cas9).</text>
  <text x="624.0" y="140.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">On re-infection, base-pairing</text>
  <text x="624.0" y="154.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">+ PAM triggers lethal cleavage</text>
  <text x="624.0" y="168.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">of the invading phage genome!</text>
  <rect x="24.0" y="244.0" width="712.0" height="94.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="264.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Genomic CRISPR array: chronological archive of past infections (newest spacer at the leader end)</text>
  <rect x="44.0" y="282.0" width="86.0" height="26.0" rx="4" fill="#f8fafc" stroke="#0f172a" stroke-width="1.4"/>
  <text x="87.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Cas genes</text>
  <rect x="138.0" y="282.0" width="58.0" height="26.0" rx="4" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/>
  <text x="167.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#7c3aed" text-anchor="middle">Leader</text>
  <polygon points="216.0,282.0 228.0,295.0 216.0,308.0 204.0,295.0" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
  <rect x="232.0" y="282.0" width="84.0" height="26.0" rx="4" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="274.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#e11d48" text-anchor="middle">New</text>
  <polygon points="332.0,282.0 344.0,295.0 332.0,308.0 320.0,295.0" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
  <rect x="348.0" y="282.0" width="84.0" height="26.0" rx="4" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.5"/>
  <text x="390.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#c25e0a" text-anchor="middle">Phage B</text>
  <polygon points="448.0,282.0 460.0,295.0 448.0,308.0 436.0,295.0" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
  <rect x="464.0" y="282.0" width="84.0" height="26.0" rx="4" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="506.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0d8a7b" text-anchor="middle">Phage A</text>
  <polygon points="564.0,282.0 576.0,295.0 564.0,308.0 552.0,295.0" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
  <rect x="580.0" y="282.0" width="84.0" height="26.0" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="622.0" y="299.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#2563eb" text-anchor="middle">Oldest</text>
  <polygon points="680.0,282.0 692.0,295.0 680.0,308.0 668.0,295.0" fill="#0f172a" stroke="#0f172a" stroke-width="1" stroke-linejoin="round"/>
  <text x="460.0" y="326.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="500" fill="#334155" text-anchor="middle">Black diamonds = identical palindromic repeats  ·  Coloured blocks = unique viral spacers (no self-cleavage because array lacks PAM!)</text>
</svg>
