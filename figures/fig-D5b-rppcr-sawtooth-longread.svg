  <polyline points="294.0,224.0 300.0,224.0 304.0,138.0 308.0,224.0 311.0,224.0 315.0,149.2 319.0,224.0 322.0,224.0 326.0,159.0 330.0,224.0 333.0,224.0 337.0,167.5 341.0,224.0 344.0,224.0 348.0,174.9 352.0,224.0 355.0,224.0 359.0,181.3 363.0,224.0 366.0,224.0 370.0,186.9 374.0,224.0 377.0,224.0 381.0,191.7 385.0,224.0 388.0,224.0 392.0,195.9 396.0,224.0 399.0,224.0 403.0,199.6 407.0,224.0 410.0,224.0 414.0,202.8 418.0,224.0 421.0,224.0 425.0,205.6 429.0,224.0 432.0,224.0 436.0,208.0 440.0,224.0 443.0,224.0 447.0,210.1 451.0,224.0" fill="none" stroke="#c25e0a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380.0" y="126.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c25e0a" text-anchor="middle">3-bp sawtooth tail!</text>
  <text x="380.0" y="256.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Repeat primer anneals at every</text>
  <text x="380.0" y="270.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">CAG → proves expansion exists</text>
  <text x="380.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">(rules out homozygosity), but</text>
  <text x="380.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">cannot size very long tracts.</text>
  <rect x="512.0" y="72.0" width="224.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="524.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">3. Long-read WGS / targeted</text>
