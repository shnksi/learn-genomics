  <rect x="584.0" y="128.0" width="28.0" height="14.0" rx="2" fill="#0d8a7b" stroke="none" stroke-width="1.2"/>
  <text x="624.0" y="118.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#1e40af" text-anchor="middle">Allele 1: 10 CAG (normal)</text>
  <rect x="532.0" y="174.0" width="184.0" height="14.0" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
