  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">SCA12 diagnostics: flanking PCR vs. RP-PCR sawtooth vs. long reads</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Large GC-rich CAG tracts fail flanking PCR (allelic dropout); RP-PCR gives a 3-bp sawtooth while long reads size every base</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="224.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">1. Flanking PCR (allelic dropout)</text>
  <line x1="44.0" y1="224.0" x2="228.0" y2="224.0" stroke="#334155" stroke-width="1.3" stroke-linecap="round"/>
  <polygon points="78.0,224.0 88.0,132.0 98.0,224.0" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-linejoin="round"/>
  <text x="88.0" y="122.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#1e40af" text-anchor="middle">10 CAG</text>
  <polygon points="164.0,224.0 174.0,178.0 184.0,224.0" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3,2"/>
  <text x="174.0" y="168.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9f1239" text-anchor="middle">55 CAG?</text>
  <text x="174.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="500" fill="#9f1239" text-anchor="middle">(fails!)</text>
  <text x="136.0" y="256.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Only 1 peak appears → looks</text>
  <text x="136.0" y="270.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">falsely homozygous (10/10)!</text>
  <text x="136.0" y="284.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Never stop at a single-peak</text>
  <text x="136.0" y="298.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">flanking PCR result.</text>
  <rect x="268.0" y="72.0" width="224.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="280.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">2. RP-PCR (sawtooth stutter)</text>
