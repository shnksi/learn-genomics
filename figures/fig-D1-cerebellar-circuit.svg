  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="365.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Cerebellar cortical circuit and why Purkinje neurons are selectively vulnerable</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Purkinje cells integrate ~150,000 parallel-fiber synapses plus one powerful climbing fiber and are the SOLE output of the cerebellar cortex</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="76.0" width="444.0" height="86.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="36.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af" text-anchor="start">Molecular layer</text>
  <text x="36.0" y="114.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">Parallel fibers (×150,000) cross flat Purkinje dendritic fan</text>
  <rect x="24.0" y="168.0" width="444.0" height="62.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.6"/>
  <text x="36.0" y="188.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="start">Purkinje cell layer (monolayer)</text>
  <text x="36.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#0f172a" text-anchor="start">Massive GABAergic neurons — SOLE cortical output (→ DCN)</text>
  <rect x="24.0" y="236.0" width="444.0" height="68.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.3"/>
  <text x="36.0" y="256.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="start">Granule cell layer</text>
  <text x="36.0" y="274.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="start">Billions of tiny excitatory granule cells (mossy-fiber input)</text>
  <circle cx="384.0" cy="198.0" r="16.0" fill="#0d8a7b" stroke="#ffffff" stroke-width="2"/>
  <text x="384.0" y="202.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">PC</text>
  <line x1="384.0" y1="182.0" x2="384.0" y2="128.0" stroke="#085f55" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="384.0" y1="142.0" x2="340.0" y2="102.0" stroke="#085f55" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="384.0" y1="142.0" x2="362.0" y2="102.0" stroke="#085f55" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="384.0" y1="142.0" x2="384.0" y2="102.0" stroke="#085f55" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="384.0" y1="142.0" x2="406.0" y2="102.0" stroke="#085f55" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="384.0" y1="142.0" x2="428.0" y2="102.0" stroke="#085f55" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="384.0" y1="216.0" x2="384.0" y2="326.0" stroke="#0d8a7b" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <rect x="314.0" y="328.0" width="140.0" height="22.0" rx="11.0" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="384.0" y="342.8" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Deep Cerebellar Nuclei</text>
  <rect x="486.0" y="76.0" width="250.0" height="272.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="498.0" y="96.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Why Purkinje cells die first in SCAs</text>
  <text x="500.0" y="114.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">1. Pacemaker firing (40–100 Hz)</text>
  <text x="500.0" y="130.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   spontaneously, 24/7 for decades</text>
  <text x="500.0" y="162.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">2. Extreme Ca²⁺ &amp; ATP demand</text>
  <text x="500.0" y="178.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   across massive dendritic arbor</text>
  <text x="500.0" y="210.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">3. Zero redundancy: sole output</text>
  <text x="500.0" y="226.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   wire from cerebellar cortex</text>
  <text x="500.0" y="258.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">4. Post-mitotic (never replaced);</text>
  <text x="500.0" y="274.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   somatic repeat instability &amp;</text>
  <text x="500.0" y="290.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   signaling drift accumulate</text>
  <text x="500.0" y="306.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="500" fill="#334155" text-anchor="start">   over a human lifetime.</text>
</svg>
