<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 355" width="760" height="355" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Transposable elements: copy-and-paste vs. cut-and-paste</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Mobile DNA accounts for ~45% of the human genome — dominated by Class I retrotransposons (LINEs, SINEs/Alu, LTRs)</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="346.0" height="174.0" rx="10" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Class I · Retrotransposons (Copy &amp; Paste via RNA)</text>
  <rect x="44.0" y="108.0" width="76.0" height="44.0" rx="8" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="82.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">Donor DNA</text>
  <line x1="122.0" y1="130.0" x2="152.0" y2="130.0" stroke="#0d8a7b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <rect x="156.0" y="108.0" width="76.0" height="44.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4"/>
  <text x="194.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#9f1239" text-anchor="middle">RNA copy</text>
  <line x1="234.0" y1="130.0" x2="264.0" y2="130.0" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-rose)"/>
  <rect x="268.0" y="108.0" width="86.0" height="44.0" rx="8" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="311.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#085f55" text-anchor="middle">New cDNA</text>
  <text x="197.0" y="178.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Reverse transcriptase (LINE-1 ORF2p) copies RNA → DNA</text>
  <text x="197.0" y="198.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#085f55" text-anchor="middle">Original copy stays → genome grows exponentially!</text>
  <text x="197.0" y="224.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748b" text-anchor="middle">Human examples: LINE-1 (autonomous), Alu (parasitic SINE)</text>
  <rect x="390.0" y="72.0" width="346.0" height="174.0" rx="10" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.2"/>
  <text x="402.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#c25e0a" text-anchor="start">Class II · DNA Transposons (Cut &amp; Paste)</text>
  <rect x="410.0" y="108.0" width="92.0" height="44.0" rx="8" fill="#ffffff" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="456.0" y="134.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="middle">TIR–Gene–TIR</text>
  <line x1="504.0" y1="130.0" x2="566.0" y2="130.0" stroke="#c25e0a" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-amber)"/>
  <text x="535.0" y="118.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c25e0a" text-anchor="middle">Transposase</text>
  <rect x="570.0" y="108.0" width="146.0" height="44.0" rx="8" fill="#ffffff" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="643.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#c25e0a" text-anchor="middle">Inserted at new site</text>
  <text x="643.0" y="144.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#334155" text-anchor="middle">+ target-site duplications</text>
  <text x="563.0" y="184.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Excised as DNA and pasted elsewhere (leaves DSB scar)</text>
  <text x="563.0" y="206.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#64748b" text-anchor="middle">Inactive fossils in humans (~3% of genome), active in bacteria</text>
  <text x="24.0" y="274.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="start">Share of the human genome (3.1 Gb):</text>
  <rect x="24.0" y="286.0" width="147.5" height="28.0" rx="4" fill="#0d8a7b" stroke="none" stroke-width="1.2"/>
  <text x="98.8" y="304.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">LINEs ~21%</text>
  <rect x="173.5" y="286.0" width="90.6" height="28.0" rx="4" fill="#2563eb" stroke="none" stroke-width="1.2"/>
  <text x="219.8" y="304.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">SINEs/Alu ~13%</text>
  <rect x="266.1" y="286.0" width="55.0" height="28.0" rx="4" fill="#7c3aed" stroke="none" stroke-width="1.2"/>
  <rect x="323.0" y="286.0" width="19.4" height="28.0" rx="4" fill="#c25e0a" stroke="none" stroke-width="1.2"/>
  <rect x="344.4" y="286.0" width="19.4" height="28.0" rx="4" fill="#e11d48" stroke="none" stroke-width="1.2"/>
  <rect x="365.8" y="286.0" width="368.2" height="28.0" rx="4" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
  <text x="550.9" y="304.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">Introns, regulatory &amp; other unique/satellite ~53%</text>
  <text x="24.0" y="334.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" fill="#334155" text-anchor="start">Coding exons (rose sliver, ~1.5%) are dwarfed ~30× by transposable-element sequence (~45%).</text>
</svg>
