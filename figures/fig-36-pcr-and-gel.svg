  <rect x="496.0" y="236.0" width="28.0" height="4.0" rx="1" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="240.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" font-weight="500" fill="#64748b" text-anchor="end">250</text>
  <rect x="496.0" y="274.0" width="28.0" height="4.0" rx="1" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
