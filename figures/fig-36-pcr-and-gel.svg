  <rect x="664.0" y="114.0" width="28.0" height="7.0" rx="1" fill="#64748b" stroke="none" stroke-width="1.2"/>
  <text x="678.0" y="326.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Del</text>
  <rect x="496.0" y="140.0" width="28.0" height="4.0" rx="1" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="144.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" font-weight="500" fill="#64748b" text-anchor="end">3kb</text>
  <rect x="496.0" y="166.0" width="28.0" height="4.0" rx="1" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
  <text x="476.0" y="170.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" font-weight="500" fill="#64748b" text-anchor="end">1kb</text>
  <rect x="496.0" y="198.0" width="28.0" height="4.0" rx="1" fill="#94a3b8" stroke="none" stroke-width="1.2"/>
