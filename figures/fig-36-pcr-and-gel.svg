  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="360.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">PCR thermal cycling and agarose gel electrophoresis</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Primers define an addressed DNA interval amplified exponentially (2ⁿ), then separated by length on a log-linear gel</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="412.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">One PCR thermal cycle (repeat 25–35× → ~10⁹ copies)</text>
  <rect x="44.0" y="108.0" width="114.0" height="110.0" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
  <text x="101.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#e11d48" text-anchor="middle">1. Denature</text>
  <rect x="68.0" y="136.0" width="66.0" height="20.0" rx="10.0" fill="#ffffff" stroke="#e11d48" stroke-width="1.2"/>
  <text x="101.0" y="149.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#e11d48" text-anchor="middle">95 °C</text>
  <text x="101.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Melts H-bonds;</text>
  <text x="101.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">separates duplex</text>
  <line x1="160.0" y1="162.0" x2="218.0" y2="162.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="178.0" y="108.0" width="114.0" height="110.0" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="235.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">2. Anneal</text>
  <rect x="202.0" y="136.0" width="66.0" height="20.0" rx="10.0" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="235.0" y="149.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#2563eb" text-anchor="middle">55–65 °C</text>
  <text x="235.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Forward &amp; reverse</text>
  <text x="235.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">primers bind flank</text>
  <line x1="294.0" y1="162.0" x2="352.0" y2="162.0" stroke="#334155" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr-ink)"/>
  <rect x="312.0" y="108.0" width="114.0" height="110.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.5"/>
  <text x="369.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">3. Extend</text>
  <rect x="336.0" y="136.0" width="66.0" height="20.0" rx="10.0" fill="#ffffff" stroke="#0d8a7b" stroke-width="1.2"/>
  <text x="369.0" y="149.8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0d8a7b" text-anchor="middle">72 °C</text>
  <text x="369.0" y="176.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">Taq Pol extends</text>
  <text x="369.0" y="190.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="500" fill="#334155" text-anchor="middle">5′→3′ from primers</text>
  <rect x="44.0" y="236.0" width="382.0" height="86.0" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="60.0" y="258.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="start">Quantitative PCR (qPCR): C_t is the cycle crossing threshold.</text>
  <text x="60.0" y="278.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="start">• ΔC_t = 1 cycle lower  ⇒  2× more starting template</text>
  <text x="60.0" y="293.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="start">• ΔC_t = 3.32 cycles    ⇒  10× more starting template</text>
  <text x="60.0" y="308.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.8" font-weight="500" fill="#334155" text-anchor="start">• End-point gels saturate in plateau — never use them for quantity!</text>
  <rect x="454.0" y="72.0" width="282.0" height="268.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="466.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Agarose gel (negatively charged DNA → +)</text>
  <rect x="480.0" y="104.0" width="230.0" height="206.0" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
