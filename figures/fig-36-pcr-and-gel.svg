  <text x="566.0" y="326.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">WT</text>
  <rect x="608.0" y="114.0" width="28.0" height="7.0" rx="1" fill="#64748b" stroke="none" stroke-width="1.2"/>
