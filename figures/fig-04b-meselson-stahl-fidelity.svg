  <text x="567.0" y="284.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">× 10⁻³  →  10⁻¹⁰</text>
