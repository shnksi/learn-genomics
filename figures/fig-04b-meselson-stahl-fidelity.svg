  <text x="88.0" y="108.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Gen 0 (¹⁵N)</text>
