  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="355.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">Distinguishing polygenicity from confounding: λ_GC vs. LD-score regression</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">True polygenic signal scales linearly with a SNP&#x27;s LD score (slope); population stratification lifts every SNP equally (intercept &gt; 1)</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="412.0" height="264.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">LD-Score Regression: E[χ²_j] = 1 + N·a + (N·h²/M) · ℓ_j</text>
  <line x1="72.0" y1="118.0" x2="72.0" y2="276.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72.0" y1="276.0" x2="408.0" y2="276.0" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="72.0" y1="276.0" x2="72.0" y2="281.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <text x="72.0" y="293.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">0</text>
  <line x1="240.0" y1="276.0" x2="240.0" y2="281.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <text x="240.0" y="293.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">100</text>
  <line x1="408.0" y1="276.0" x2="408.0" y2="281.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <text x="408.0" y="293.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="middle">200</text>
  <line x1="67.0" y1="276.0" x2="72.0" y2="276.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
