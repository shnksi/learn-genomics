  <text x="64.0" y="279.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">0.8</text>
  <line x1="67.0" y1="236.5" x2="72.0" y2="236.5" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="73.0" y1="236.5" x2="408.0" y2="236.5" stroke="#e2e8f0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,3"/>
  <text x="64.0" y="240.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">1.0</text>
  <line x1="67.0" y1="178.0" x2="72.0" y2="178.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="73.0" y1="178.0" x2="408.0" y2="178.0" stroke="#e2e8f0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,3"/>
  <text x="64.0" y="181.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">1.4</text>
  <line x1="67.0" y1="118.0" x2="72.0" y2="118.0" stroke="#334155" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="73.0" y1="118.0" x2="408.0" y2="118.0" stroke="#e2e8f0" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3,3"/>
  <text x="64.0" y="121.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="500" fill="#64748b" text-anchor="end">1.8</text>
  <text x="240.0" y="310.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">SNP LD score ℓ_j (sum of r² with neighbours)</text>
  <text x="36.0" y="197.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle" transform="rotate(-90 36.0 197.0)">Mean χ²</text>
  <line x1="72.0" y1="236.5" x2="408.0" y2="236.5" stroke="#cbd5e1" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3,3"/>
  <line x1="72.0" y1="236.5" x2="408.0" y2="152.8" stroke="#0d8a7b" stroke-width="2.8" stroke-linecap="round"/>
  <text x="402.0" y="165.4" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#085f55" text-anchor="end">True polygenicity (intercept ≈ 1.0)</text>
  <line x1="72.0" y1="190.7" x2="408.0" y2="124.3" stroke="#e11d48" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="5,3"/>
  <text x="80.0" y="184.7" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#9f1239" text-anchor="start">Stratification lifts intercept &gt; 1!</text>
  <circle cx="72.0" cy="236.5" r="5.0" fill="#0d8a7b" stroke="none" stroke-width="1.5"/>
  <circle cx="72.0" cy="190.7" r="5.0" fill="#e11d48" stroke="none" stroke-width="1.5"/>
  <rect x="454.0" y="72.0" width="282.0" height="264.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="466.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Why λ_GC alone misleads modern GWAS</text>
  <rect x="468.0" y="108.0" width="254.0" height="96.0" rx="8" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.4"/>
  <text x="595.0" y="128.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#c25e0a" text-anchor="middle">Genomic inflation λ_GC = median(χ²)/0.455</text>
  <text x="595.0" y="144.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">Cannot tell apart confounding vs. true</text>
  <text x="595.0" y="158.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">polygenicity! In N = 500,000 height GWAS,</text>
  <text x="595.0" y="172.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">λ_GC ≈ 1.6 purely from real biology!</text>
  <rect x="468.0" y="218.0" width="254.0" height="102.0" rx="8" fill="#e0f5f2" stroke="#0d8a7b" stroke-width="1.4"/>
  <text x="595.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">LD-score regression separates both:</text>
  <text x="595.0" y="254.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">• Intercept ≈ 1.00 → clean, unconfounded!</text>
  <text x="595.0" y="268.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">• Intercept &gt; 1.05 → cryptic stratification.</text>
  <text x="595.0" y="282.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">• Slope → estimates SNP heritability h²_SNP</text>
  <text x="595.0" y="296.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.0" font-weight="500" fill="#334155" text-anchor="middle">  from summary statistics alone!</text>
</svg>
