<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 365" width="760" height="365" role="img">
  <defs>
  <marker id="arr-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/></marker>
  <marker id="arr-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0d8a7b"/></marker>
  <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#c25e0a"/></marker>
  <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#2563eb"/></marker>
  <marker id="arr-rose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#e11d48"/></marker>
  <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0.0" y="0.0" width="760.0" height="365.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1.2"/>
  <text x="24.0" y="30.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#0f172a" text-anchor="start">The end-replication problem and how telomerase solves it</text>
  <text x="24.0" y="48.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="500" fill="#64748b" text-anchor="start">Removing the terminal lagging-strand RNA primer leaves an unfillable gap; telomerase extends the 3′ template using its own RNA</text>
  <line x1="24.0" y1="58.0" x2="736.0" y2="58.0" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/>
  <rect x="24.0" y="72.0" width="344.0" height="272.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="36.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Problem: linear ends shrink every S phase</text>
  <text x="44.0" y="112.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="700" fill="#0f172a" text-anchor="start">Parental 3′→5′</text>
  <line x1="44.0" y1="124.0" x2="342.0" y2="124.0" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
  <text x="348.0" y="127.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="start">3′</text>
  <line x1="44.0" y1="146.0" x2="274.0" y2="146.0" stroke="#0d8a7b" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="276.0" y1="146.0" x2="342.0" y2="146.0" stroke="#e11d48" stroke-width="4.2" stroke-linecap="round"/>
  <text x="309.0" y="162.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#9f1239" text-anchor="middle">Terminal primer</text>
  <line x1="194.0" y1="172.0" x2="194.0" y2="196.0" stroke="#e11d48" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-rose)"/>
  <text x="262.0" y="188.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="500" fill="#9f1239" text-anchor="start">RNase H removes primer</text>
  <line x1="44.0" y1="212.0" x2="342.0" y2="212.0" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
  <line x1="44.0" y1="234.0" x2="274.0" y2="234.0" stroke="#0d8a7b" stroke-width="3.2" stroke-linecap="round"/>
  <rect x="276.0" y="224.0" width="66.0" height="20.0" rx="3" fill="#fff1f2" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="3,2"/>
  <text x="309.0" y="238.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#9f1239" text-anchor="middle">No 3′-OH!</text>
  <text x="196.0" y="276.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">No upstream 3′-OH exists to fill the 5′ gap.</text>
  <text x="196.0" y="291.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">Somatic cells lose ~50–100 bp/division → Hayflick</text>
  <text x="196.0" y="306.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.3" font-weight="500" fill="#334155" text-anchor="middle">senescence; shelterin hides overhang from DSB repair!</text>
  <rect x="388.0" y="72.0" width="348.0" height="272.0" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="400.0" y="92.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#085f55" text-anchor="start">Solution: Telomerase (TERT + TERC RNA template)</text>
  <line x1="408.0" y1="134.0" x2="594.0" y2="134.0" stroke="#0f172a" stroke-width="3.0" stroke-linecap="round"/>
  <line x1="594.0" y1="134.0" x2="694.0" y2="134.0" stroke="#0d8a7b" stroke-width="3.6" stroke-linecap="round"/>
  <text x="644.0" y="122.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.2" font-weight="700" fill="#085f55" text-anchor="middle">TTAGGG added →</text>
  <ellipse cx="602.0" cy="168.0" rx="92.0" ry="30.0" fill="#fff3e5" stroke="#c25e0a" stroke-width="1.8"/>
  <text x="602.0" y="165.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.8" font-weight="700" fill="#c25e0a" text-anchor="middle">TERC RNA: 3′-CAAUCCCAAUC-5′</text>
  <text x="602.0" y="181.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">TERT reverse transcriptase</text>
  <line x1="562.0" y1="204.0" x2="562.0" y2="226.0" stroke="#0d8a7b" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr-teal)"/>
  <text x="642.0" y="218.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.8" font-weight="700" fill="#085f55" text-anchor="start">Primase + Pol α refill</text>
  <line x1="408.0" y1="240.0" x2="694.0" y2="240.0" stroke="#0d8a7b" stroke-width="3.2" stroke-linecap="round"/>
  <line x1="408.0" y1="260.0" x2="650.0" y2="260.0" stroke="#2563eb" stroke-width="3.2" stroke-linecap="round"/>
  <text x="562.0" y="286.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#085f55" text-anchor="middle">Active in germline, stem cells &amp; ~85% of cancers.</text>
  <text x="562.0" y="304.0" font-family="'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9.2" font-weight="500" fill="#334155" text-anchor="middle">Telomerase is a ribonucleoprotein carrying its own template!</text>
</svg>
